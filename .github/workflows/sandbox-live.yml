name: Sandbox Live Tests

# Manual dispatch only: exercises the real Wise sandbox (api.wise-sandbox.com).
# Gated on the WISE_SANDBOX_API_KEY secret — the Go tests skip themselves when
# it is absent, so dispatching without the secret is a green no-op (see the
# SKIP lines in the log), never a false failure.
on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  # go-branded-id and go-error-family use encoding/json/v2, which requires
  # the jsonv2 experiment on Go 1.26.
  GOEXPERIMENT: "jsonv2"

jobs:
  sandbox-live:
    name: Sandbox Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run sandbox live tests
        env:
          WISE_SANDBOX_API_KEY: ${{ secrets.WISE_SANDBOX_API_KEY }}
        run: go test -run TestSandboxLive -v -count=1 ./...

    timeout-minutes: 10
